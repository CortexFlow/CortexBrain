name: Core Build Checks

on:
  pull_request:
    branches: [ main, PreReleaseMain, 0.1.5 ]
  push:
    branches: [ main, PreReleaseMain ]

jobs:
  check-common-features:
    name: Check common features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no features
            args: --no-default-features
          - name: network structs
            args: --no-default-features --features network-structs
          - name: monitoring structs
            args: --no-default-features --features monitoring-structs
          - name: network buffer reader
            args: --no-default-features --features buffer-reader,network-structs
          - name: monitoring buffer reader
            args: --no-default-features --features buffer-reader,monitoring-structs
          - name: handlers
            args: --no-default-features --features map-handlers,program-handlers
          - name: runtime features
            args: --no-default-features --features map-handlers,program-handlers,network-structs,monitoring-structs,buffer-reader
          - name: all features
            args: --all-features

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check cortexbrain-common feature isolation
      working-directory: core
      run: cargo check --locked -p cortexbrain-common ${{ matrix.args }}

  test-common-contracts:
    name: Test common event contracts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test cortexbrain-common public contracts
      working-directory: core
      run: cargo test --locked -p cortexbrain-common --test public_contracts --no-default-features --features network-structs,monitoring-structs

  build-core-components:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build CortexFlow Agent
      run: |
        cd core
        chmod +x agent-api-build.sh
        echo "🚀 Starting CortexFlow Agent build..."
        ./agent-api-build.sh || { echo "❌ Agent build failed"; exit 1; }
        echo "✅ Agent build completed"
        
    - name: Build CortexFlow Identity
      run: |
        cd core
        chmod +x identity-build.sh
        echo "🚀 Starting CortexFlow Identity build..."
        ./identity-build.sh || { echo "❌ Identity build failed"; exit 1; }
        echo "✅ Identity build completed"

    - name: Build CortexFlow Metrics
      run: |
        cd core
        chmod +x metrics-build.sh
        echo "🚀 Starting CortexFlow Metrics build..."
        ./metrics-build.sh || { echo "❌ Metrics build failed"; exit 1; }
        echo "✅ Metrics build completed"
        
    - name: Verify Docker images were built
      run: |
        echo "Listing all Docker images:"
        docker images
        echo "Checking for core component images..."
        
        # Check cortexflow-agent
        if docker images | grep -q "cortexflow-agent"; then
          echo "✅ cortexflow-agent image found"
        else
          echo "❌ cortexflow-agent image not found"
          exit 1
        fi
        
        # Check identity
        if docker images | grep -q "identity"; then
          echo "✅ identity image found" 
        else
          echo "❌ identity image not found"
          exit 1
        fi
        
        # Check metrics
        if docker images | grep -q "metrics"; then
          echo "✅ metrics image found"
        else
          echo "❌ metrics image not found"
          exit 1
        fi
        
    - name: Verify builds completed successfully
      run: |
        echo "All Docker builds completed successfully!"
        echo "CI pipeline focuses on build verification, not tests"
        
    - name: Cleanup build artifacts
      run: |
        docker system prune -f
