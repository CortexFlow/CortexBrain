[package]
name = "cortexbrain-common"
version = "0.1.3"
edition = "2024"
description = "CortexFlow core packages"
license = "Apache-2.0"
readme = "../../README.md"
documentation = "https://docs.cortexflow.org"
homepage = "https://docs.cortexflow.org"
repository = "https://github.com/CortexFlow/CortexBrain"
authors = [
    "Lorenzo Tettamanti",
    "Pranav Verma",
    "Lorenzo Bradanini",
    "Siddharth Sutar",
    "Andrea Bozzo",
    "Daniele Cangi"
]

[dependencies]
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
kube = { version = "4.2.0", features = ["client"] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
aya = "0.14.0"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.0", features = ["logs", "rt-tokio"] }
opentelemetry-stdout = { version = "0.32.0", features = ["logs"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["logs", "grpc-tonic"] }
bytemuck = "1.25.0"
bytes = "1.12.1"
bytemuck_derive = "1.10.2"
tokio = {version="1.49.0",features=["sync"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
map-handlers = []
program-handlers = []
network-structs = []
monitoring-structs = []
buffer-reader = []
experimental = []
