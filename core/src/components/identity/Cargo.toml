[package]
name = "cortexflow_identity"
version = "0.1.1"
edition = "2024"
description = "CortexFlow identity service package"
license = "Apache-2.0"
readme = "../../../../README.md"
documentation = "https://docs.cortexflow.org"
homepage = "https://docs.cortexflow.org"
repository = "https://github.com/CortexFlow/CortexBrain"

[features]
default = ["struct", "enums"]
struct = []
enums = []
experimental = ["struct", "enums"]

[dependencies]
aya = "0.14.0"
bytes = "1.4"
tokio = { version = "1.48.0", features = [
    "rt",
    "rt-multi-thread",
    "signal",
    "fs",
    "time",
    "macros",
] }
tracing = "0.1.41"
bytemuck = { version = "1.23.0", features = ["derive"] }
cortexbrain-common = { version="0.1.2", features = [
    "map-handlers",
    "program-handlers",
    "network-structs",
    "monitoring-structs",
    "buffer-reader",
    "experimental"
] }
nix = { version = "0.31.3", features = ["net"] }
kube = { version = "4.2.0", features = ["client"] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
bytemuck_derive = "1.10.2"
anyhow = "1.0.100"
