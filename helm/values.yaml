global:
  otel:
    endpoint: http://localhost:4317
    protocol: grpc
  tolerations: []
  priorityClassName: ""

blocklist: ""
serviceAccountName: cortexflow-sa

agent:
  image:
    repository: ghcr.io/cortexflow/agent
    version: latest
  resources:
    limits:
      memory: "200Mi"
    requests:
      cpu: "100m"
      memory: "100Mi"
  securityContext:
    privileged: true
    allowPrivilegeEscalation: true
    capabilities:
      add:
        - SYS_ADMIN
        - NET_ADMIN
        - SYS_RESOURCE
        - BPF
        - SYS_PTRACE
  tolerations: []
  priorityClassName: ""

identity:
  image:
    repository: ghcr.io/cortexflow/identity
    version: latest
  resources:
    limits:
      memory: "200Mi"
    requests:
      cpu: "100m"
      memory: "100Mi"
  securityContext:
    privileged: true
    allowPrivilegeEscalation: true
    capabilities:
      add:
        - SYS_ADMIN
        - NET_ADMIN
        - SYS_RESOURCE
        - BPF
        - SYS_PTRACE
  tolerations: []
  priorityClassName: ""

metrics:
  image:
    repository: ghcr.io/cortexflow/metrics
    version: latest
  resources:
    limits:
      cpu: "1"
      memory: "200Mi"
    requests:
      cpu: "1"
      memory: "100Mi"
  securityContext:
    privileged: true
    allowPrivilegeEscalation: true
    capabilities:
      add:
        - SYS_ADMIN
        - NET_ADMIN
        - SYS_RESOURCE
        - BPF
        - SYS_PTRACE
  tolerations: []
  priorityClassName: ""

bpfTool:
  image:
    repository: danielpacak/bpftool-runner
    version: latest
  resources:
    limits:
      cpu: "1"
      memory: "200Mi"
    requests:
      cpu: "1"
      memory: "100Mi"
  securityContext:
    privileged: true
    allowPrivilegeEscalation: true
    capabilities:
      add:
        - SYS_ADMIN
        - NET_ADMIN
        - SYS_RESOURCE
        - BPF
        - SYS_PTRACE

bpfMapPermissions:
  image:
    repository: ubuntu
    version: "24.04"
  securityContext:
    runAsUser: 0
    privileged: true
    allowPrivilegeEscalation: true
    capabilities:
      add:
        - SYS_ADMIN
        - NET_ADMIN
        - SYS_RESOURCE
        - BPF
        - SYS_PTRACE
