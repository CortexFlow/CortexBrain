apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cortexflow-metrics
  namespace: cortexflow
  labels:
    app: cortexflow-metrics
spec:
  selector:
    matchLabels:
      app: cortexflow-metrics
  template:
    metadata:
      labels:
        app: cortexflow-metrics
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      hostPID: true
      hostNetwork: true
      {{- include "common.tolerations" (dict "context" . "component" "metrics") | indent 6 }}
      {{- include "common.priorityClassName" (dict "context" . "component" "metrics") | indent 6 }}
      containers:
        - name: metrics
          image: "{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.version }}"
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Running on kernel $(uname -r)"
              if [ ! -d "/sys/fs/bpf" ]; then
                echo "ERROR: BPF filesystem not mounted"
                exit 1
              else
                echo "Checking ebpf path..."
                ls -l /sys/fs/bpf
              fi
              echo "checking privileges"
              ls -ld /sys/fs/bpf

              echo "Running application..."
              exec /usr/local/bin/cortexflow-metrics || echo "Application exited with code $?"
          env:
            - name: OTEL_SERVICE_NAME
              value: cortexflow-metrics
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.global.otel.protocol }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=cortexflow,service.version=0.1.5
          volumeMounts:
            - name: bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
              readOnly: false
            - name: proc
              mountPath: /host/proc
              readOnly: false
            - name: kernel-dev
              mountPath: /lib/modules
              readOnly: false
            - name: tracefs
              mountPath: /sys/kernel/debug
              readOnly: false
          securityContext:
            {{- .Values.metrics.securityContext | toYaml | nindent 12 }}
        - name: bpftool-control-manager
          image: "{{ .Values.bpfTool.image.repository }}:{{ .Values.bpfTool.image.version }}"
          command: ["/bin/bash", "-c", "sleep infinity"]
          volumeMounts:
            - name: bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
              readOnly: false
            - name: proc
              mountPath: /host/proc
              readOnly: false
            - name: kernel-dev
              mountPath: /lib/modules
              readOnly: false
            - name: tracefs
              mountPath: /sys/kernel/debug
              readOnly: false
          resources:
            {{- .Values.bpfTool.resources | toYaml | nindent 12 }}
          securityContext:
            {{- .Values.bpfTool.securityContext | toYaml | nindent 12 }}
      volumes:
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: kernel-dev
          hostPath:
            path: /lib/modules
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
