receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    limit_mib: 1500
    spike_limit_mib: 512
    check_interval: 5s

exporters:
  logging: {}
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: cortexbrain

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [logging]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [logging, prometheus]
